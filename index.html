<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>✦ ARCANE HANDS — Cinematic Edition</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap');
*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:100%;height:100%;overflow:hidden;background:#000;}

/* ── CANVAS STACK ──
   Layer 0: #video-bg  — kamera görüntüsü (loş, multiply karanlık)
   Layer 1: #base-cvs  — trail + duman + iz katmanı
   Layer 2: #fx-cvs    — ana efektler (screen blend)
   Layer 3: #bloom-cvs — glow bloom (screen blend)
   Layer 4: #ui        — arayüz
*/
#video-bg{
  position:fixed;inset:0;width:100%;height:100%;
  object-fit:cover;transform:scaleX(-1);
  z-index:0;display:none;
  /* Karanlık atmosfer: loş kamera */
  filter:brightness(0.42) saturate(0.7);
}
#base-cvs{
  position:fixed;inset:0;z-index:1;
  pointer-events:none;
}
#fx-cvs{
  position:fixed;inset:0;z-index:2;
  mix-blend-mode:screen;
  pointer-events:none;
}
#bloom-cvs{
  position:fixed;inset:0;z-index:3;
  mix-blend-mode:screen;
  pointer-events:none;
  opacity:0.82;
}

/* ── UI ── */
#ui{position:fixed;inset:0;z-index:20;pointer-events:none;}

/* GUIDE SOL */
.glass{
  background:rgba(4,0,18,.78);
  border:1px solid rgba(176,96,255,.3);
  backdrop-filter:blur(16px);
  border-radius:12px;
}
#guide{
  position:absolute;top:14px;left:14px;
  padding:12px 15px;width:210px;
}
#guide-title{
  font-family:'Orbitron',sans-serif;font-size:.6rem;
  letter-spacing:.18em;color:#40d0ff;margin-bottom:9px;
}
.gi{
  display:flex;align-items:center;gap:7px;
  padding:5px 7px;margin-bottom:3px;
  border-radius:5px;background:rgba(255,255,255,.03);
  border-left:2px solid rgba(176,96,255,.25);
  font-size:.68rem;color:rgba(255,255,255,.52);
  transition:.25s;
}
.gi.lit{
  background:rgba(176,96,255,.16);
  border-left-color:#b060ff;color:#fff;
}
.gi .ic{min-width:18px;text-align:center;}
.gi .ef{
  margin-left:auto;font-family:'Orbitron',sans-serif;
  font-size:.58rem;color:#b060ff;opacity:.75;
}

/* PANEL SAĞ */
#panel{
  position:absolute;top:14px;right:14px;
  padding:14px 18px;min-width:200px;text-align:right;
}
#brand{
  font-family:'Orbitron',sans-serif;font-size:.85rem;font-weight:900;
  letter-spacing:.22em;
  background:linear-gradient(135deg,#b060ff,#40d0ff);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  margin-bottom:7px;
}
#status{font-size:.68rem;color:rgba(255,255,255,.38);margin-bottom:5px;min-height:14px;}
#combo-bar{
  font-size:.62rem;color:#ffd060;min-height:12px;
  margin-bottom:5px;opacity:0;transition:.3s;
}
.stat{
  display:flex;justify-content:space-between;
  font-size:.62rem;color:rgba(255,255,255,.3);margin-bottom:3px;
}
.stat span{font-family:'Orbitron',sans-serif;font-size:.65rem;color:#40d0ff;}
#fps-v{color:#0f0 !important;}
#pwr-wrap{
  height:3px;background:rgba(255,255,255,.08);
  border-radius:3px;margin-top:7px;overflow:hidden;
}
#pwr-bar{
  height:100%;width:0;
  background:linear-gradient(90deg,#b060ff,#40d0ff);
  border-radius:3px;transition:width .1s;
}

/* CONTROLS */
#ctrl{
  position:absolute;bottom:18px;left:50%;transform:translateX(-50%);
  display:flex;gap:8px;align-items:center;
  padding:8px 12px;pointer-events:all;
}
.btn{
  font-family:'Orbitron',sans-serif;font-size:.6rem;
  letter-spacing:.1em;padding:7px 13px;
  border-radius:7px;border:1px solid rgba(176,96,255,.35);
  background:rgba(4,0,18,.9);color:rgba(255,255,255,.6);
  cursor:pointer;transition:.2s;
}
.btn:hover{border-color:#b060ff;color:#fff;box-shadow:0 0 16px rgba(176,96,255,.35);}
.btn.on{background:#b060ff;color:#000;font-weight:700;border-color:#b060ff;}

.sep{width:1px;height:24px;background:rgba(255,255,255,.1);}
.sp{
  width:34px;height:34px;border-radius:50%;
  border:2px solid rgba(255,255,255,.18);
  cursor:pointer;display:flex;align-items:center;justify-content:center;
  font-size:.95rem;transition:.2s;background:rgba(0,0,0,.35);
}
.sp:hover{transform:scale(1.12);}
.sp.on{transform:scale(1.18);border-color:#fff;box-shadow:0 0 16px var(--sc);}

/* GESTURE FLASH */
#gflash{
  position:absolute;top:50%;left:50%;
  transform:translate(-50%,-50%);
  font-family:'Orbitron',sans-serif;font-size:1.3rem;
  letter-spacing:.3em;color:#fff;
  text-shadow:0 0 35px #b060ff,0 0 70px #b060ff;
  opacity:0;transition:opacity .1s;
  pointer-events:none;
}

/* COMBO OVERLAY */
#combo-overlay{
  position:fixed;inset:0;z-index:15;pointer-events:none;
  background:radial-gradient(ellipse at center,rgba(255,208,96,.15),transparent 70%);
  opacity:0;transition:opacity .4s;
}

/* LOADING */
#loading{
  position:fixed;inset:0;z-index:100;background:#000;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
}
#loading h2{
  font-family:'Orbitron',sans-serif;font-size:1.1rem;
  letter-spacing:.3em;color:#eedcff;text-shadow:0 0 28px #b060ff;
}
#loading p{color:#7030aa55;font-size:.62rem;letter-spacing:.2em;}
.lorb{
  width:52px;height:52px;border-radius:50%;
  background:radial-gradient(circle at 33% 33%,#f0d8ff,#b060ff,#4a0aaa);
  box-shadow:0 0 30px #b060ff,0 0 60px #7020bb;
  animation:lb 1.5s ease-in-out infinite;
}
@keyframes lb{0%,100%{transform:scale(1)}50%{transform:scale(1.24)}}
</style>
</head>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

<script>
'use strict';

// ═══════════════════════════════════════════════════════
// CANVAS SETUP
// ═══════════════════════════════════════════════════════
const videoBg  = document.getElementById('video-bg');
const baseCvs  = document.getElementById('base-cvs');
const fxCvs    = document.getElementById('fx-cvs');
const blmCvs   = document.getElementById('bloom-cvs');
const baseCtx  = baseCvs.getContext('2d');
const fxCtx    = fxCvs.getContext('2d');
const blmCtx   = blmCvs.getContext('2d');

let W = 0, H = 0;
function resize(){
  W = baseCvs.width = fxCvs.width = blmCvs.width = window.innerWidth;
  H = baseCvs.height = fxCvs.height = blmCvs.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

// ═══════════════════════════════════════════════════════
// PALETLER
// ═══════════════════════════════════════════════════════
const PAL = {
  arcane:  {r:176,g:96, b:255, mid:'#d080ff', base:'#6010cc', hex:'#b060ff', smoke:[80,20,140]},
  electric:{r:64, g:200,b:255, mid:'#80e8ff', base:'#1080cc', hex:'#40d0ff', smoke:[10,60,120]},
  fire:    {r:255,g:100,b:10,  mid:'#ffaa40', base:'#cc3000', hex:'#ff5f1f', smoke:[60,10,5]},
  ice:     {r:100,g:230,b:255, mid:'#a0f0ff', base:'#30a0cc', hex:'#80f0ff', smoke:[20,50,90]},
  void:    {r:255,g:35, b:160, mid:'#ff80c0', base:'#801040', hex:'#ff40b0', smoke:[30,0,55]},
};

// Sol / sağ el paletleri
let palL = 'arcane', palR = 'fire';
function getpal(isRight){ return PAL[isRight ? palR : palL]; }

// ═══════════════════════════════════════════════════════
// PERLIN-LIKE NOISE (2D, 3 harmonic)
// ═══════════════════════════════════════════════════════
function noise(x, y){
  return ((Math.sin(x*127.1+y*311.7)*43758.5453)%1)*0.5
        +((Math.sin(x*269.5+y*183.3)*43758.5453)%1)*0.3
        +((Math.sin(x*419.2+y*371.9)*43758.5453)%1)*0.2;
}

// ═══════════════════════════════════════════════════════
// FLOW FIELD — curl-noise turbulans
// ═══════════════════════════════════════════════════════
const FR = 22;
let fCols, fRows, ff;
let fT = 0;
function buildFF(){
  fCols = Math.ceil(W/FR)+1;
  fRows = Math.ceil(H/FR)+1;
  ff = new Float32Array(fCols*fRows*2);
}
buildFF();
window.addEventListener('resize', buildFF);

function updateFF(){
  fT += 0.0022;
  for(let y=0;y<fRows;y++){
    for(let x=0;x<fCols;x++){
      const i=(y*fCols+x)*2;
      const n  = noise(x*0.06+fT,  y*0.06+fT*0.55);
      const n2 = noise(x*0.04+fT*1.2+5, y*0.035+fT*0.9+3);
      const a = n*Math.PI*4 + n2*Math.PI;
      ff[i]   = Math.cos(a);
      ff[i+1] = Math.sin(a);
    }
  }
}
function ffAt(px,py){
  const cx=Math.min(fCols-1,Math.max(0,px/FR|0));
  const cy=Math.min(fRows-1,Math.max(0,py/FR|0));
  const i=(cy*fCols+cx)*2;
  return {x:ff[i],y:ff[i+1]};
}

// ═══════════════════════════════════════════════════════
// PARTICLE ENGINE — typed arrays, 3000 cap
// Types: 0=orb 1=ember 2=smoke 3=spark 4=wisp 5=tendril 6=ice
// ═══════════════════════════════════════════════════════
const MAX = 3000;
const px_=new Float32Array(MAX), py_=new Float32Array(MAX);
const pvx=new Float32Array(MAX), pvy=new Float32Array(MAX);
const plf=new Float32Array(MAX), pdc=new Float32Array(MAX);
const psz=new Float32Array(MAX);
const pty=new Uint8Array(MAX), psp=new Uint8Array(MAX), pac=new Uint8Array(MAX);
const prt=new Float32Array(MAX), prv=new Float32Array(MAX);
let pHead=0;

const SPIDX  = {arcane:0,electric:1,fire:2,ice:3,void:4};
const SPLIST = ['arcane','electric','fire','ice','void'];

function spawn(x,y,type,count,pal,scl=1){
  const si = SPIDX[pal]||0;
  for(let n=0;n<count;n++){
    let idx=-1;
    for(let k=0;k<MAX;k++){const p=(pHead+k)%MAX;if(!pac[p]){idx=p;break;}}
    if(idx<0) idx=pHead%MAX;
    pHead=(pHead+1)%MAX;

    px_[idx]=x+(Math.random()-.5)*9;
    py_[idx]=y+(Math.random()-.5)*9;
    psp[idx]=si; pty[idx]=type; pac[idx]=1; plf[idx]=1;
    prt[idx]=Math.random()*Math.PI*2;
    prv[idx]=(Math.random()-.5)*0.045;
    const m=scl;

    switch(type){
      case 0: // orb
        pvx[idx]=(Math.random()-.5)*1.3;
        pvy[idx]=(Math.random()-.5)*1.3;
        pdc[idx]=.006+Math.random()*.006;
        psz[idx]=(3+Math.random()*8)*m; break;
      case 1: // ember — fire-like, shoots up
        const ea=Math.random()*Math.PI*2, es=(1.5+Math.random()*5)*m;
        pvx[idx]=Math.cos(ea)*es; pvy[idx]=Math.sin(ea)*es-3;
        pdc[idx]=.018+Math.random()*.025; psz[idx]=(2+Math.random()*5)*m; break;
      case 2: // smoke
        pvx[idx]=(Math.random()-.5)*.7;
        pvy[idx]=-(Math.random()*1.2+.3);
        pdc[idx]=.003+Math.random()*.0038;
        psz[idx]=(18+Math.random()*40)*m; break;
      case 3: // spark — fast streak
        const sa=Math.random()*Math.PI*2, ss=(5+Math.random()*12)*m;
        pvx[idx]=Math.cos(sa)*ss; pvy[idx]=Math.sin(sa)*ss;
        pdc[idx]=.032+Math.random()*.05; psz[idx]=(.7+Math.random()*2.5)*m; break;
      case 4: // wisp
        pvx[idx]=(Math.random()-.5)*.5;
        pvy[idx]=-(Math.random()*.9+.4);
        pdc[idx]=.006+Math.random()*.005;
        psz[idx]=(6+Math.random()*15)*m; break;
      case 5: // tendril — spiral
        const ta=Math.random()*Math.PI*2, ts=(.7+Math.random()*1.6)*m;
        pvx[idx]=Math.cos(ta)*ts; pvy[idx]=Math.sin(ta)*ts;
        pdc[idx]=.009+Math.random()*.009; psz[idx]=(2+Math.random()*6)*m; break;
      case 6: // ice crystal
        const ia=Math.random()*Math.PI*2, iss=(1+Math.random()*3.5)*m;
        pvx[idx]=Math.cos(ia)*iss; pvy[idx]=Math.sin(ia)*iss-1.5;
        pdc[idx]=.014+Math.random()*.018; psz[idx]=(2+Math.random()*7)*m; break;
    }
  }
}

function updateParticles(){
  for(let i=0;i<MAX;i++){
    if(!pac[i]) continue;
    plf[i]-=pdc[i];
    if(plf[i]<=0){pac[i]=0;continue;}
    const f=ffAt(px_[i],py_[i]);
    let fi;
    switch(pty[i]){
      case 0:fi=.20;break; case 2:fi=.05;break; case 4:fi=.28;break;
      case 5:fi=.16;break; default:fi=.018;
    }
    pvx[i]+=f.x*fi; pvy[i]+=f.y*fi;
    if(pty[i]===1||pty[i]===6) pvy[i]+=.055;
    if(pty[i]===3) pvy[i]+=.022;
    if(pty[i]===5){
      const sp=.038,ox=pvx[i],oy=pvy[i];
      pvx[i]=ox*Math.cos(sp)-oy*Math.sin(sp);
      pvy[i]=ox*Math.sin(sp)+oy*Math.cos(sp);
    }
    const d=pty[i]===2?.99:.958;
    pvx[i]*=d; pvy[i]*=d;
    prt[i]+=prv[i];
    px_[i]+=pvx[i]; py_[i]+=pvy[i];
    if(px_[i]<-120||px_[i]>W+120||py_[i]<-120||py_[i]>H+120) pac[i]=0;
  }
}

function countActive(){
  let c=0;for(let i=0;i<MAX;i++) if(pac[i]) c++;
  return c;
}

// ── DRAW PARTICLES (two-pass: fx + bloom) ──
function drawParticles(ctx, isBloom){
  ctx.save();
  for(let i=0;i<MAX;i++){
    if(!pac[i]) continue;
    const s=SPELL_LIST_DRAW[psp[i]]; const p=PAL[s];
    const a=plf[i], t=pty[i], sz=psz[i];
    const x=px_[i],y=py_[i];
    const [er,eg,eb]=[p.r,p.g,p.b];

    if(t===2){ // ── VOLUMETRIC SMOKE
      if(isBloom) continue;
      const [sr,sg,sb]=p.smoke;
      const ex=sz*(1+(1-a)*0.8);
      ctx.globalAlpha=a*0.065;
      ctx.save();
      ctx.translate(x,y);ctx.rotate(prt[i]);
      const g1=ctx.createRadialGradient(0,0,0,0,0,ex);
      g1.addColorStop(0,`rgba(${sr},${sg},${sb},1)`);
      g1.addColorStop(.55,`rgba(${sr},${sg},${sb},.35)`);
      g1.addColorStop(1,`rgba(${sr},${sg},${sb},0)`);
      ctx.fillStyle=g1;
      ctx.beginPath();ctx.ellipse(0,0,ex,ex*.85,0,0,Math.PI*2);ctx.fill();
      ctx.restore();

    } else if(t===0){ // ── ORB
      const [cr,cg,cb]=p.core||[255,255,255];
      if(isBloom){
        ctx.globalAlpha=a*.55;
        const bg=ctx.createRadialGradient(x,y,0,x,y,sz*5.5);
        bg.addColorStop(0,`rgba(${er},${eg},${eb},.6)`);
        bg.addColorStop(.4,`rgba(${er},${eg},${eb},.1)`);
        bg.addColorStop(1,`rgba(${er},${eg},${eb},0)`);
        ctx.fillStyle=bg;ctx.beginPath();ctx.arc(x,y,sz*5.5,0,Math.PI*2);ctx.fill();
      } else {
        ctx.globalAlpha=a;
        ctx.shadowBlur=sz*4;ctx.shadowColor=`rgb(${er},${eg},${eb})`;
        const g=ctx.createRadialGradient(x-sz*.2,y-sz*.2,0,x,y,sz);
        g.addColorStop(0,'rgba(255,255,255,1)');
        g.addColorStop(.3,`rgba(${er},${eg},${eb},.92)`);
        g.addColorStop(.7,`rgba(${er},${eg},${eb},.3)`);
        g.addColorStop(1,`rgba(${er},${eg},${eb},0)`);
        ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,sz,0,Math.PI*2);ctx.fill();
      }

    } else if(t===1||t===3){ // ── EMBER / SPARK
      const bsz=t===3?sz*.4:sz;
      if(isBloom){
        ctx.globalAlpha=a*.42;
        const bg=ctx.createRadialGradient(x,y,0,x,y,bsz*7);
        bg.addColorStop(0,`rgba(${er},${eg},${eb},.4)`);
        bg.addColorStop(1,`rgba(${er},${eg},${eb},0)`);
        ctx.fillStyle=bg;ctx.beginPath();ctx.arc(x,y,bsz*7,0,Math.PI*2);ctx.fill();
      } else {
        if(t===3&&(pvx[i]||pvy[i])){
          ctx.globalAlpha=a*.72;
          ctx.strokeStyle=`rgba(255,255,255,${a})`;
          ctx.lineWidth=bsz*.85;ctx.lineCap='round';
          ctx.shadowBlur=bsz*3;ctx.shadowColor=`rgb(${er},${eg},${eb})`;
          ctx.beginPath();ctx.moveTo(x-pvx[i]*4,y-pvy[i]*4);ctx.lineTo(x,y);ctx.stroke();
        } else {
          ctx.globalAlpha=a;
          ctx.shadowBlur=bsz*4.5;ctx.shadowColor=`rgb(${er},${eg},${eb})`;
          ctx.fillStyle='rgba(255,255,255,.95)';
          ctx.beginPath();ctx.arc(x,y,bsz,0,Math.PI*2);ctx.fill();
        }
      }

    } else if(t===4||t===5){ // ── WISP / TENDRIL
      if(isBloom){
        ctx.globalAlpha=a*.6;
        const bg=ctx.createRadialGradient(x,y,0,x,y,sz*3.8);
        bg.addColorStop(0,`rgba(${er},${eg},${eb},.55)`);
        bg.addColorStop(1,`rgba(${er},${eg},${eb},0)`);
        ctx.fillStyle=bg;ctx.beginPath();ctx.arc(x,y,sz*3.8,0,Math.PI*2);ctx.fill();
      } else {
        ctx.globalAlpha=a*.85;
        ctx.shadowBlur=sz*2.8;ctx.shadowColor=`rgb(${er},${eg},${eb})`;
        const g=ctx.createRadialGradient(x,y,0,x,y,sz);
        g.addColorStop(0,'rgba(255,255,255,.92)');
        g.addColorStop(.4,`rgba(${er},${eg},${eb},.65)`);
        g.addColorStop(1,`rgba(${er},${eg},${eb},0)`);
        ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,sz,0,Math.PI*2);ctx.fill();
      }

    } else { // ── ICE CRYSTAL (6)
      if(isBloom){
        ctx.globalAlpha=a*.5;
        const bg=ctx.createRadialGradient(x,y,0,x,y,sz*4.5);
        bg.addColorStop(0,`rgba(${er},${eg},${eb},.45)`);
        bg.addColorStop(1,`rgba(${er},${eg},${eb},0)`);
        ctx.fillStyle=bg;ctx.beginPath();ctx.arc(x,y,sz*4.5,0,Math.PI*2);ctx.fill();
      } else {
        ctx.globalAlpha=a;
        ctx.shadowBlur=sz*3;ctx.shadowColor=`rgb(${er},${eg},${eb})`;
        // hexagon ice shard
        ctx.save();ctx.translate(x,y);ctx.rotate(prt[i]);
        ctx.fillStyle=`rgba(${er},${eg},${eb},${a*.7})`;
        ctx.strokeStyle=`rgba(255,255,255,${a*.9})`;
        ctx.lineWidth=.8;
        ctx.beginPath();
        for(let k=0;k<6;k++){
          const a2=k*Math.PI/3;
          k===0?ctx.moveTo(Math.cos(a2)*sz,Math.sin(a2)*sz)
               :ctx.lineTo(Math.cos(a2)*sz,Math.sin(a2)*sz);
        }
        ctx.closePath();ctx.fill();ctx.stroke();
        ctx.restore();
      }
    }
  }
  ctx.globalAlpha=1;ctx.shadowBlur=0;ctx.restore();
}
const SPELL_LIST_DRAW=['arcane','electric','fire','ice','void'];

// ═══════════════════════════════════════════════════════
// CINEMATIC FLAME ENGINE (from fire reference)
// ═══════════════════════════════════════════════════════
let T=0;
function drawFlame(ctx,x,y,height,width,t,alpha,p){
  ctx.save();
  ctx.globalCompositeOperation='lighter';
  for(let layer=0;layer<3;layer++){
    const sc=1-layer*.2;
    const h2=height*sc, w2=width*sc*(.65+layer*.28);
    const sw=noise(x*.01,y*.01+layer*100+t*.9)*16;
    const sw2=noise(x*.01,y*.01+layer*200+t*1.3+1)*9;
    ctx.save();
    ctx.filter=layer===0?'blur(9px)':'none';
    const grad=ctx.createLinearGradient(x,y,x+sw*.3,y-h2);
    if(layer===0){
      grad.addColorStop(0,`rgba(${p.r},${p.g},${p.b},.9)`);
      grad.addColorStop(.4,`rgba(${p.r},${p.g},${p.b},.45)`);
      grad.addColorStop(1,'rgba(0,0,0,0)');
    } else if(layer===1){
      grad.addColorStop(0,p.base);
      grad.addColorStop(.4,p.mid);
      grad.addColorStop(.85,'rgba(255,255,255,.95)');
      grad.addColorStop(1,'rgba(0,0,0,0)');
    } else {
      grad.addColorStop(0,p.mid);
      grad.addColorStop(.5,'rgba(255,255,255,.9)');
      grad.addColorStop(1,'rgba(0,0,0,0)');
    }
    ctx.globalAlpha=alpha*(.7+layer*.1);
    ctx.fillStyle=grad;
    ctx.beginPath();
    ctx.moveTo(x-w2*.5,y);
    ctx.bezierCurveTo(x-w2*.9+sw,y-h2*.25,x-w2*.4+sw2,y-h2*.65,x+sw*.5,y-h2);
    ctx.bezierCurveTo(x+w2*.4+sw2,y-h2*.65,x+w2*.9+sw,y-h2*.25,x+w2*.5,y);
    ctx.closePath();ctx.fill();
    ctx.restore();
  }
  // tip glow
  const tpSw=noise(x*.01,y*.01+t*1.2)*14;
  drawCoreGlow(ctx,x+tpSw*.3,y-height*.88,6,alpha*.9,p);
  ctx.restore();
}

function drawCoreGlow(ctx,x,y,r,alpha,p){
  const g=ctx.createRadialGradient(x,y,0,x,y,r);
  g.addColorStop(0,`rgba(255,255,255,${alpha})`);
  g.addColorStop(.3,`rgba(255,255,255,${alpha*.6})`);
  g.addColorStop(.7,`rgba(${p.r},${p.g},${p.b},${alpha*.3})`);
  g.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();
}

function drawAura(ctx,x,y,r,alpha,p){
  ctx.save();
  ctx.globalCompositeOperation='lighter';
  ctx.filter='blur(18px)';
  const g=ctx.createRadialGradient(x,y,0,x,y,r);
  g.addColorStop(0,`rgba(${p.r},${p.g},${p.b},${alpha*.7})`);
  g.addColorStop(.45,`rgba(${p.r},${p.g},${p.b},${alpha*.2})`);
  g.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();
  ctx.restore();
}

// ═══════════════════════════════════════════════════════
// ENERGY ORB (2-hand + fist)
// ═══════════════════════════════════════════════════════
let orbData=null, orbA=0, orbP=0;

function drawBigOrb(ctx,isBloom,x,y,r,p,pulseM=1){
  const [er,eg,eb]=[p.r,p.g,p.b];
  const pr=r*pulseM;
  ctx.save();
  if(isBloom){
    ctx.globalAlpha=.44;
    const bg=ctx.createRadialGradient(x,y,0,x,y,pr*6);
    bg.addColorStop(0,`rgba(${er},${eg},${eb},.58)`);
    bg.addColorStop(.45,`rgba(${er},${eg},${eb},.1)`);
    bg.addColorStop(1,`rgba(${er},${eg},${eb},0)`);
    ctx.fillStyle=bg;ctx.beginPath();ctx.arc(x,y,pr*6,0,Math.PI*2);ctx.fill();
    // inner core bloom
    ctx.globalAlpha=.7;
    const gc=ctx.createRadialGradient(x,y,0,x,y,pr*1.5);
    gc.addColorStop(0,'rgba(255,255,255,.8)');gc.addColorStop(1,'rgba(255,255,255,0)');
    ctx.fillStyle=gc;ctx.beginPath();ctx.arc(x,y,pr*1.5,0,Math.PI*2);ctx.fill();
  } else {
    ctx.globalCompositeOperation='lighter';
    // atmosphere
    ctx.globalAlpha=.15;
    const ao=ctx.createRadialGradient(x,y,0,x,y,pr*3.5);
    ao.addColorStop(0,`rgba(${er},${eg},${eb},.5)`);ao.addColorStop(1,`rgba(${er},${eg},${eb},0)`);
    ctx.fillStyle=ao;ctx.beginPath();ctx.arc(x,y,pr*3.5,0,Math.PI*2);ctx.fill();
    // sphere
    ctx.globalAlpha=.9;
    ctx.shadowBlur=pr*3;ctx.shadowColor=`rgb(${er},${eg},${eb})`;
    const gs=ctx.createRadialGradient(x-pr*.28,y-pr*.28,0,x,y,pr);
    gs.addColorStop(0,'rgba(255,255,255,1)');
    gs.addColorStop(.2,`rgba(${er},${eg},${eb},1)`);
    gs.addColorStop(.6,`rgba(${er},${eg},${eb},.4)`);
    gs.addColorStop(1,`rgba(${er},${eg},${eb},0)`);
    ctx.fillStyle=gs;ctx.beginPath();ctx.arc(x,y,pr,0,Math.PI*2);ctx.fill();
    // specular
    ctx.globalAlpha=.4;ctx.shadowBlur=0;
    const gh=ctx.createRadialGradient(x-pr*.35,y-pr*.38,0,x-pr*.2,y-pr*.25,pr*.42);
    gh.addColorStop(0,'rgba(255,255,255,.92)');gh.addColorStop(1,'rgba(255,255,255,0)');
    ctx.fillStyle=gh;ctx.beginPath();ctx.ellipse(x-pr*.2,y-pr*.28,pr*.38,pr*.22,-.4,0,Math.PI*2);ctx.fill();
    // dashed ring
    ctx.globalAlpha=.65;ctx.shadowBlur=10;ctx.shadowColor=`rgb(${er},${eg},${eb})`;
    ctx.strokeStyle=`rgba(255,255,255,.65)`;ctx.lineWidth=1.4;
    ctx.setLineDash([5,8]);ctx.lineDashOffset=-T*40;
    ctx.beginPath();ctx.arc(x,y,pr*(0.88+Math.sin(T*2)*.06),0,Math.PI*2);ctx.stroke();
    ctx.setLineDash([]);
    // orbiting dots
    for(let k=0;k<10;k++){
      const a=orbA*1.6+k*Math.PI*.2;
      const d=pr*(1.08+Math.sin(orbP+k*.7)*.09);
      const ox=x+Math.cos(a)*d,oy=y+Math.sin(a)*d;
      ctx.globalAlpha=.88;ctx.shadowBlur=4;
      const gs2=ctx.createRadialGradient(ox,oy,0,ox,oy,2.3);
      gs2.addColorStop(0,'rgba(255,255,255,1)');gs2.addColorStop(1,`rgba(${er},${eg},${eb},0)`);
      ctx.fillStyle=gs2;ctx.beginPath();ctx.arc(ox,oy,2.3,0,Math.PI*2);ctx.fill();
    }
    // rotating arcs
    ctx.shadowBlur=8;ctx.shadowColor=`rgb(${er},${eg},${eb})`;
    for(let k=0;k<5;k++){
      const a0=orbA+k*Math.PI*2/5;
      ctx.globalAlpha=.5;ctx.strokeStyle=`rgba(${er},${eg},${eb},.75)`;ctx.lineWidth=1.3;ctx.setLineDash([]);
      ctx.beginPath();ctx.arc(x,y,pr*(.72+k*.035),a0,a0+Math.PI*.78);ctx.stroke();
    }
  }
  ctx.restore();
}

// ═══════════════════════════════════════════════════════
// LIGHTNING — multi-pass (blur outer + white core)
// ═══════════════════════════════════════════════════════
const bolts=[];

function makeBolt(x1,y1,x2,y2,depth,segs,w){
  if(depth<=0){segs.push([x1,y1,x2,y2,w]);return;}
  const len=Math.hypot(x2-x1,y2-y1);
  const nx=-(y2-y1)/len*len*.45,ny=(x2-x1)/len*len*.45;
  const mx=(x1+x2)/2+nx*(Math.random()-.5)*2;
  const my=(y1+y2)/2+ny*(Math.random()-.5)*2;
  makeBolt(x1,y1,mx,my,depth-1,segs,w);
  makeBolt(mx,my,x2,y2,depth-1,segs,w);
  if(Math.random()<.3&&depth===2)
    makeBolt(mx,my,mx+(Math.random()-.5)*100,my+(Math.random()-.5)*100,1,segs,w*.5);
}

function spawnBolt(x1,y1,x2,y2,thick=1){
  const s=[];makeBolt(x1,y1,x2,y2,3,s,thick);
  bolts.push({s,life:1,decay:.06+Math.random()*.09,p:getpal(Math.random()>.5)});
}

function drawBolts(ctx){
  for(let i=bolts.length-1;i>=0;i--){
    const b=bolts[i];b.life-=b.decay;
    if(b.life<=0){bolts.splice(i,1);continue;}
    const p=b.p,{r,g,b:bl}=[p.r,p.g,p.b];
    ctx.save();ctx.globalAlpha=b.life;ctx.globalCompositeOperation='lighter';
    ctx.lineCap='round';
    // outer blur
    ctx.filter='blur(6px)';
    b.s.forEach(([x1,y1,x2,y2,w])=>{
      ctx.strokeStyle=`rgba(${p.r},${p.g},${p.b},.45)`;
      ctx.lineWidth=(w||1)*8;ctx.shadowBlur=20;ctx.shadowColor=p.hex;
      ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();
    });
    ctx.filter='none';
    // white core
    b.s.forEach(([x1,y1,x2,y2,w])=>{
      ctx.strokeStyle='rgba(255,255,255,.92)';
      ctx.lineWidth=(w||1)*1.2;ctx.shadowBlur=4;
      ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();
    });
    ctx.restore();
  }
}

// ═══════════════════════════════════════════════════════
// LASER
// ═══════════════════════════════════════════════════════
function drawLaser(ctx,x,y,angle,length,alpha,p){
  const ex=x+Math.cos(angle)*length, ey=y+Math.sin(angle)*length;
  ctx.save();ctx.globalCompositeOperation='lighter';
  ctx.filter='blur(8px)';
  const g=ctx.createLinearGradient(x,y,ex,ey);
  g.addColorStop(0,`rgba(${p.r},${p.g},${p.b},${alpha})`);
  g.addColorStop(1,'rgba(0,0,0,0)');
  ctx.strokeStyle=g;ctx.lineWidth=14;ctx.lineCap='round';ctx.globalAlpha=alpha;
  ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(ex,ey);ctx.stroke();
  ctx.filter='none';
  ctx.strokeStyle=`rgba(255,255,255,${alpha*.9})`;ctx.lineWidth=2.5;
  ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(ex,ey);ctx.stroke();
  drawCoreGlow(ctx,x,y,10,alpha,p);
  ctx.restore();
}

// ═══════════════════════════════════════════════════════
// WISP EFFECT
// ═══════════════════════════════════════════════════════
function drawWisp(ctx,x,y,t,alpha,p){
  ctx.save();ctx.globalCompositeOperation='lighter';
  const wx=noise(x*.01,y*.01+t*.8)*28, wy=noise(x*.01+100,y*.01+t*.6)*16;
  ctx.filter='blur(10px)';
  drawAura(ctx,x+wx,y+wy,50,alpha*.45,p);
  ctx.filter='none';
  drawFlame(ctx,x+wx,y+wy,75,20,t,alpha*.82,p);
  drawCoreGlow(ctx,x+wx,y+wy+32,8,alpha*.9,p);
  ctx.restore();
}

// ═══════════════════════════════════════════════════════
// SKELETON (glowing, from naruto/cinematic refs)
// ═══════════════════════════════════════════════════════
const CONN=[
  [0,1],[1,2],[2,3],[3,4],[5,6],[6,7],[7,8],
  [9,10],[10,11],[11,12],[13,14],[14,15],[15,16],
  [17,18],[18,19],[19,20],
  [0,5],[5,9],[9,13],[13,17],[0,17]
];
function s2c(lm){ return {x:(1-lm.x)*W, y:lm.y*H}; }
function palmC(lms){
  let x=0,y=0;
  [0,5,9,13,17].forEach(i=>{const p=s2c(lms[i]);x+=p.x;y+=p.y;});
  return {x:x/5,y:y/5};
}

function drawSkel(ctx,lms,alpha,p){
  ctx.save();
  ctx.globalCompositeOperation='lighter';
  // connections
  ctx.strokeStyle=p.mid;ctx.lineWidth=2.5;ctx.lineCap='round';
  ctx.shadowBlur=12;ctx.shadowColor=p.hex;ctx.globalAlpha=alpha;
  ctx.beginPath();
  CONN.forEach(([a,b])=>{
    const pa=s2c(lms[a]),pb=s2c(lms[b]);
    ctx.moveTo(pa.x,pa.y);ctx.lineTo(pb.x,pb.y);
  });
  ctx.stroke();
  // joint dots
  ctx.globalAlpha=alpha*1.4;ctx.shadowBlur=6;ctx.shadowColor='#fff';
  ctx.fillStyle=p.mid;
  for(let i=0;i<21;i++){
    const pt=s2c(lms[i]);
    const r=[0,4,8,12,16,20].includes(i)?3.5:1.8;
    ctx.beginPath();ctx.arc(pt.x,pt.y,r,0,Math.PI*2);ctx.fill();
  }
  ctx.restore();
}

// ═══════════════════════════════════════════════════════
// PARMAK UCU İZLERİ
// ═══════════════════════════════════════════════════════
const TIPS=[4,8,12,16,20];
const TRAILS=Array.from({length:2},()=>TIPS.map(()=>[]));

function addTrl(hi,fi,x,y){
  const t=TRAILS[hi][fi];
  t.push({x,y,l:1});if(t.length>26)t.shift();
}
function updateTrails(){
  TRAILS.forEach(h=>h.forEach(t=>{
    for(let i=t.length-1;i>=0;i--){t[i].l-=.055;if(t[i].l<=0)t.splice(i,1);}
  }));
}
function drawTrails(ctx,p){
  ctx.save();ctx.lineCap='round';ctx.globalCompositeOperation='lighter';
  TRAILS.forEach(h=>h.forEach(tr=>{
    if(tr.length<2)return;
    for(let i=1;i<tr.length;i++){
      const p0=tr[i-1],p1=tr[i];
      ctx.globalAlpha=p1.l*.55;
      ctx.strokeStyle=`rgb(${p.r},${p.g},${p.b})`;
      ctx.lineWidth=p1.l*3.8;ctx.shadowBlur=8;ctx.shadowColor=p.hex;
      ctx.beginPath();ctx.moveTo(p0.x,p0.y);ctx.lineTo(p1.x,p1.y);ctx.stroke();
      ctx.globalAlpha=p1.l*.3;ctx.strokeStyle='rgba(255,255,255,1)';
      ctx.lineWidth=p1.l*1.1;ctx.shadowBlur=3;
      ctx.beginPath();ctx.moveTo(p0.x,p0.y);ctx.lineTo(p1.x,p1.y);ctx.stroke();
    }
  }));
  ctx.globalAlpha=1;ctx.shadowBlur=0;ctx.restore();
}

// ═══════════════════════════════════════════════════════
// JEST ALGILAMA
// ═══════════════════════════════════════════════════════
function detectGesture(lms){
  const tips=[4,8,12,16,20].map(i=>lms[i]);
  const pips=[3,6,10,14,18].map(i=>lms[i]);
  const wrist=lms[0];
  const ext=[];
  ext.push(Math.abs(tips[0].x-wrist.x)>Math.abs(pips[0].x-wrist.x)*.6?1:0);
  for(let i=1;i<5;i++) ext.push(tips[i].y<pips[i].y?1:0);
  const tot=ext.reduce((a,b)=>a+b,0);
  if(tot>=4) return 'OPEN';
  if(tot===0) return 'FIST';
  if(ext[1]&&ext[2]&&!ext[3]&&!ext[4]) return 'PEACE';
  if(ext[1]&&!ext[2]&&!ext[3]&&!ext[4]) return 'POINT';
  if(!ext[1]&&!ext[2]&&!ext[3]&&ext[4]) return 'PINKY';
  if(ext[0]&&!ext[1]&&!ext[2]&&!ext[3]&&ext[4]) return 'ROCK';
  return 'PARTIAL';
}

// ═══════════════════════════════════════════════════════
// SES SENTEZİ
// ═══════════════════════════════════════════════════════
let audioCtx=null;
function initAudio(){if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();}
function playTone(freq,type='sine',dur=.15,vol=.08){
  if(!audioCtx)return;
  const o=audioCtx.createOscillator(),g=audioCtx.createGain();
  o.type=type;o.frequency.value=freq;
  g.gain.setValueAtTime(vol,audioCtx.currentTime);
  g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+dur);
  o.connect(g);g.connect(audioCtx.destination);
  o.start();o.stop(audioCtx.currentTime+dur);
}
const GSND={OPEN:[400,'triangle',.2],FIST:[200,'sawtooth',.3],PEACE:[800,'square',.1],POINT:[1200,'sine',.12],PINKY:[300,'sine',.25],ROCK:[150,'sawtooth',.4]};

// ═══════════════════════════════════════════════════════
// KOMBO SİSTEMİ
// ═══════════════════════════════════════════════════════
let comboLog=[], comboActive=false;
const COMBO_WIN=2.0;

function logGesture(g){
  if(g==='PARTIAL') return;
  const now=performance.now()/1000;
  comboLog.push({g,t:now});
  comboLog=comboLog.filter(x=>now-x.t<COMBO_WIN);
  const uniq=new Set(comboLog.map(x=>x.g));
  if(uniq.size>=3&&!comboActive){
    comboActive=true;
    const cb=document.getElementById('combo-bar');
    cb.textContent='✦ SUPREME COMBO ✦';cb.style.opacity='1';
    document.getElementById('combo-overlay').style.opacity='1';
    // büyük patlama
    for(let i=0;i<80;i++){
      const px=W/2+(Math.random()-.5)*300, py=H/2+(Math.random()-.5)*200;
      spawn(px,py,3,1,'arcane',2.2);spawn(px,py,0,1,'divine',2);
    }
    playTone(600,'triangle',.6,.25);
    setTimeout(()=>{
      comboActive=false;cb.style.opacity='0';
      document.getElementById('combo-overlay').style.opacity='0';
    },2200);
  }
}

// ═══════════════════════════════════════════════════════
// GÜÇ (power) per hand
// ═══════════════════════════════════════════════════════
const power=[0,0];
const ACTIVE_GESTURES=['OPEN','FIST','PEACE','POINT','PINKY','ROCK'];

// ═══════════════════════════════════════════════════════
// HAND DATA
// ═══════════════════════════════════════════════════════
let handData=[];   // [{lms, gesture, isRight}]
let prevPalms=[null,null];
let handVel=[{x:0,y:0},{x:0,y:0}];

// ═══════════════════════════════════════════════════════
// EL EFEKTLERİ — gesture bazlı render
// ═══════════════════════════════════════════════════════
function renderHand(ctx,hand,hi,t){
  const lms=hand.lms, g=hand.gesture, isR=hand.isRight;
  const p=getpal(isR);
  const palm=palmC(lms);
  const tips=TIPS.map(i=>s2c(lms[i]));

  // Güç hesapla
  if(ACTIVE_GESTURES.includes(g)) power[hi]=Math.min(1,power[hi]+.05);
  else power[hi]=Math.max(0,power[hi]-.07);
  const pwr=power[hi];
  document.getElementById('pwr-bar').style.width=`${pwr*100}%`;

  // İskelet
  drawSkel(ctx,lms,.28+pwr*.5,p);
  if(pwr<.04) return;

  // Parmak ucu izleri
  TIPS.forEach((ti,fi)=>{
    const tip=s2c(lms[ti]);
    addTrl(hi,fi,tip.x,tip.y);
  });

  // Ses
  if(ACTIVE_GESTURES.includes(g)&&pwr>.3&&Math.random()<.08){
    const [fr,ty,du]=GSND[g]||[440,'sine',.1];
    playTone(fr,ty,du,.07);
  }

  const TIPPTS=TIPS.map(i=>s2c(lms[i]));
  const charge=pwr;

  ctx.save();
  ctx.globalCompositeOperation='lighter';

  switch(g){
    case 'OPEN':
      // Her parmak ucunda alev
      TIPPTS.forEach((tip,fi)=>{
        drawFlame(ctx,tip.x,tip.y,(80+Math.sin(t*2+fi)*14)*charge,14,t+fi*.7,charge*.9,p);
        if(pwr>.5&&frame%3===0) spawn(tip.x,tip.y-15,1,1,isR?palR:palL,.9);
        if(frame%2===0) spawn(tip.x,tip.y,2,1,isR?palR:palL,.7);
      });
      drawAura(ctx,palm.x,palm.y,75,charge*.3,p);
      // Avuç ısısı
      if(frame%2===0){spawn(palm.x,palm.y,0,2,isR?palR:palL);spawn(palm.x,palm.y,4,1,isR?palR:palL);}
      break;

    case 'FIST':
      // Yumrukta yoğunlaşan orb
      drawBigOrb(ctx,false,palm.x,palm.y,(30+charge*28)*(1+Math.sin(t*4)*.08),p,pwr);
      if(pwr>.5&&frame%3===0){
        spawn(palm.x,palm.y,0,3,isR?palR:palL);
        spawn(palm.x,palm.y,2,1,isR?palR:palL);
      }
      break;

    case 'PEACE':{
      // V işareti: parmaktan şimşek kıvılcımı
      const ip=s2c(lms[8]), mp=s2c(lms[12]);
      const a8=Math.atan2(ip.y-palm.y,ip.x-palm.x);
      const a12=Math.atan2(mp.y-palm.y,mp.x-palm.x);
      drawFlame(ctx,ip.x,ip.y,90*charge,10,t,charge*.9,p);
      drawFlame(ctx,mp.x,mp.y,90*charge,10,t,charge*.9,p);
      if(frame%8===0) spawnBolt(ip.x,ip.y,mp.x,mp.y,1.3);
      if(frame%10===0) spawnBolt(ip.x,ip.y,ip.x+Math.cos(a8)*140,ip.y+Math.sin(a8)*140,1.0);
      if(frame%10===0) spawnBolt(mp.x,mp.y,mp.x+Math.cos(a12)*140,mp.y+Math.sin(a12)*140,1.0);
      spawn(ip.x,ip.y,3,2,isR?palR:palL);spawn(mp.x,mp.y,3,2,isR?palR:palL);
      break;
    }
    case 'POINT':{
      // İşaret parmağından lazer
      const tip=s2c(lms[8]);
      const angle=Math.atan2(tip.y-s2c(lms[6]).y,tip.x-s2c(lms[6]).x);
      drawLaser(ctx,tip.x,tip.y,angle,380,charge*.95,p);
      drawFlame(ctx,tip.x,tip.y,40*charge,8,t,charge*.7,p);
      if(frame%3===0) spawn(tip.x,tip.y,3,3,isR?palR:palL,1.1);
      break;
    }
    case 'PINKY':
      // Küçük parmaktan wisp
      drawWisp(ctx,s2c(lms[20]).x,s2c(lms[20]).y,t,charge*.9,p);
      if(frame%3===0){
        spawn(s2c(lms[20]).x,s2c(lms[20]).y,4,2,isR?palR:palL);
        spawn(s2c(lms[20]).x,s2c(lms[20]).y,5,1,isR?palR:palL);
      }
      break;

    case 'ROCK':{
      // Kaos: orb + çift yıldırım çatalı
      drawBigOrb(ctx,false,palm.x,palm.y,38,p,pwr);
      const i8=s2c(lms[8]),i20=s2c(lms[20]);
      const d8=Math.atan2(i8.y-palm.y,i8.x-palm.x);
      const d20=Math.atan2(i20.y-palm.y,i20.x-palm.x);
      drawFlame(ctx,i8.x,i8.y,100*charge,14,t,charge*.9,p);
      drawFlame(ctx,i20.x,i20.y,100*charge,14,t,charge*.9,p);
      if(frame%4===0){
        spawnBolt(i8.x,i8.y,i8.x+Math.cos(d8)*160,i8.y+Math.sin(d8)*160,1.1);
        spawnBolt(i20.x,i20.y,i20.x+Math.cos(d20)*160,i20.y+Math.sin(d20)*160,1.1);
      }
      if(frame%5===0) spawnBolt(palm.x,palm.y,palm.x+(Math.random()-.5)*200,palm.y+(Math.random()-.5)*180,1.2);
      spawn(palm.x,palm.y,1,3,isR?palR:palL,1.1);
      spawn(palm.x,palm.y,3,3,isR?palR:palL);
      break;
    }
    default:
      if(frame%3===0){spawn(palm.x,palm.y,0,1,isR?palR:palL);spawn(palm.x,palm.y,4,1,isR?palR:palL);}
  }
  ctx.restore();

  // Kombo kayıt
  if(ACTIVE_GESTURES.includes(g)&&pwr>.38) logGesture(g);
}

// ═══════════════════════════════════════════════════════
// GUIDE HIGHLIGHT
// ═══════════════════════════════════════════════════════
const GMAP={OPEN:'g-open',FIST:'g-fist',PEACE:'g-peace',POINT:'g-point',PINKY:'g-pinky',ROCK:'g-rock'};
const GNAME={OPEN:'ALEV',FIST:'ORB',PEACE:'ŞİMŞEK',POINT:'LAZER',PINKY:'WİSP',ROCK:'KAOS'};
let lastG='',flashTmr;
const gflash=document.getElementById('gflash');
let litId=null;

function flashGesture(g){
  if(g===lastG||g==='PARTIAL') return;
  lastG=g;clearTimeout(flashTmr);
  gflash.textContent=GNAME[g]||'';gflash.style.opacity='1';
  flashTmr=setTimeout(()=>gflash.style.opacity='0',650);
  if(litId){document.getElementById(litId)?.classList.remove('lit');litId=null;}
  const gid=GMAP[g];
  if(gid){document.getElementById(gid)?.classList.add('lit');litId=gid;}
}

// ═══════════════════════════════════════════════════════
// STATS
// ═══════════════════════════════════════════════════════
let fpsFrames=0,fpsVal=60,fpsLast=0;
function tickStats(now){
  fpsFrames++;
  if(now-fpsLast>=900){
    fpsVal=Math.round(fpsFrames*1000/(now-fpsLast));
    fpsFrames=0;fpsLast=now;
  }
  const fe=document.getElementById('fps-v');
  fe.textContent=fpsVal;
  fe.style.color=fpsVal>40?'#0f0':fpsVal>20?'#ff0':'#f00';
  document.getElementById('hand-v').textContent=handData.length;
  document.getElementById('ptk-v').textContent=countActive();
}

// ═══════════════════════════════════════════════════════
// MAIN LOOP
// ═══════════════════════════════════════════════════════
let frame=0, demoMode=false, demoT=0, camActive=false;

function loop(now){
  requestAnimationFrame(loop);
  frame++;T+=.016;
  tickStats(now);
  updateFF();
  updateTrails();
  updateParticles();

  // ── BASE canvas: trail iz bırak (yarı şeffaf siyah)
  baseCtx.fillStyle='rgba(0,0,0,.14)';
  baseCtx.fillRect(0,0,W,H);

  // ── FX canvas: temizle
  fxCtx.clearRect(0,0,W,H);

  // ── BLOOM canvas: temizle
  blmCtx.clearRect(0,0,W,H);

  // ── DEMO
  if(demoMode){
    demoT+=.014;
    const rr=Math.min(W,H)*.21;
    const gs=['OPEN','FIST','ROCK'];
    const phL=Math.floor(demoT*.3)%gs.length;
    const phR=(phL+1)%gs.length;
    handData=[
      {lms:makeDemoLms(W/2-rr*Math.cos(demoT),H/2+rr*Math.sin(demoT*.55)*.7),gesture:gs[phL],isRight:false},
      {lms:makeDemoLms(W/2+rr*Math.cos(demoT+Math.PI),H/2-rr*Math.sin(demoT*.55+.5)*.7),gesture:gs[phR],isRight:true},
    ];
  }

  // ── EL EFEKTLERİ
  let h0=null,h1=null;
  handData.forEach((hand,hi)=>{
    if(!hand?.lms) return;
    const palm=palmC(hand.lms);
    if(prevPalms[hi]){handVel[hi]={x:palm.x-prevPalms[hi].x,y:palm.y-prevPalms[hi].y};}
    prevPalms[hi]={...palm};

    flashGesture(hand.gesture);

    // Trail draw (base layer)
    drawTrails(baseCtx,getpal(hand.isRight));

    // Orb data for 2-hand
    if(hi===0) h0=palm; else h1=palm;

    // Main effects on fx layer
    renderHand(fxCtx,hand,hi,T);

    // Velocity burst sparks
    const speed=Math.hypot(handVel[hi].x,handVel[hi].y);
    if(speed>14){
      const n=Math.min(12,Math.floor(speed/9));
      spawn(palm.x,palm.y,3,n,hand.isRight?palR:palL);
    }
  });

  // ── 2-HAND ORB
  if(h0&&h1){
    const dist=Math.hypot(h1.x-h0.x,h1.y-h0.y);
    orbA+=.035;orbP+=.053;
    const r=Math.max(22,dist*.14);
    const ox=(h0.x+h1.x)/2,oy=(h0.y+h1.y)/2;
    const pAvg=PAL[palL]; // blend
    drawBigOrb(fxCtx,false,ox,oy,r*(1+Math.sin(orbP)*.14),pAvg,1);
    drawBigOrb(blmCtx,true,ox,oy,r*(1+Math.sin(orbP)*.14),pAvg,1);
    if(frame%4===0) spawnBolt(h0.x,h0.y,h1.x,h1.y,1.4);
    if(frame%2===0){spawn(ox,oy,0,2,palL);spawn(ox,oy,4,1,palL);}
  } else { orbA+=.034;orbP+=.052; }

  // ── DUMAN / ORB bloom
  drawParticles(fxCtx,false);
  drawBolts(fxCtx);
  drawParticles(blmCtx,true);

  // ── Arka plan ambient (el yokken)
  if(handData.length===0&&!demoMode){
    fxCtx.save();fxCtx.globalCompositeOperation='lighter';
    for(let i=0;i<8;i++){
      const bx=W*(.2+.6*Math.sin(T*.65+i*1.2));
      const by=H*(.3+.4*Math.cos(T*.5+i*.9));
      const ag=PAL.arcane;
      fxCtx.globalAlpha=.06;
      const g=fxCtx.createRadialGradient(bx,by,0,bx,by,3+Math.sin(T*2+i)*2);
      g.addColorStop(0,ag.mid);g.addColorStop(1,'rgba(0,0,0,0)');
      fxCtx.fillStyle=g;fxCtx.beginPath();fxCtx.arc(bx,by,5,0,Math.PI*2);fxCtx.fill();
    }
    fxCtx.restore();
  }
}

function makeDemoLms(cx,cy){
  return Array.from({length:21},(_,i)=>({
    x:1-(cx+(Math.sin(i*.88)*32))/W,
    y:(cy+(Math.cos(i*.75)*22))/H,z:0
  }));
}

// ═══════════════════════════════════════════════════════
// MEDİAPİPE
// ═══════════════════════════════════════════════════════
let mpHands=null;

async function initMP(){
  try{
    document.getElementById('load-txt').textContent='MEDİAPİPE YÜKLENİYOR…';
    mpHands=new Hands({locateFile:f=>`https://cdn.jsdelivr.net/npm/@mediapipe/hands/${f}`});
    mpHands.setOptions({
      maxNumHands:2,modelComplexity:1,
      minDetectionConfidence:.65,minTrackingConfidence:.6
    });
    mpHands.onResults(res=>{
      if(demoMode) return;
      handData=[];
      if(res.multiHandLandmarks&&res.multiHandLandmarks.length>0){
        res.multiHandLandmarks.forEach((lms,i)=>{
          const label=res.multiHandedness?.[i]?.label||'Right';
          handData.push({lms,gesture:detectGesture(lms),isRight:label==='Right'});
        });
      }
      document.getElementById('status').textContent=
        handData.length?`🎥 ${handData.length} el — ${handData.map(h=>h.gesture).join(' | ')}`:'🎥 El bekleniyor…';
    });
    document.getElementById('load-txt').textContent='HAZIR!';
    document.getElementById('status').textContent='Kamera aç veya Demo kullan';
  }catch(e){
    document.getElementById('load-txt').textContent='DEMO KULLAN';
  }
}

async function startCam(){
  initAudio();
  try{
    const s=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:1280,height:720}});
    videoBg.srcObject=s;videoBg.style.display='block';
    await videoBg.play();
    camActive=true;
    document.getElementById('cam-btn').textContent='✕ KAPAT';
    document.getElementById('cam-btn').classList.add('on');
    document.getElementById('status').textContent='🎥 Kamera aktif — el göster!';
    if(mpHands){
      const c=new Camera(videoBg,{
        onFrame:async()=>{if(camActive)await mpHands.send({image:videoBg});},
        width:1280,height:720
      });
      c.start();
    }
  }catch(e){
    document.getElementById('status').textContent='Kamera izni reddedildi';
  }
}

function stopCam(){
  videoBg.srcObject?.getTracks().forEach(t=>t.stop());
  videoBg.style.display='none';camActive=false;handData=[];
  document.getElementById('cam-btn').textContent='📷 KAMERA';
  document.getElementById('cam-btn').classList.remove('on');
  document.getElementById('status').textContent='Kamera kapatıldı';
}

// ═══════════════════════════════════════════════════════
// MOUSE FALLBACK
// ═══════════════════════════════════════════════════════
let mouseG='OPEN',mPrev={x:null,y:null};
fxCvs.style.pointerEvents='all';
fxCvs.addEventListener('mousemove',e=>{
  if(camActive||demoMode)return;
  const vel={x:mPrev.x?e.clientX-mPrev.x:0,y:mPrev.y?e.clientY-mPrev.y:0};
  mPrev={x:e.clientX,y:e.clientY};
  handData=[{lms:makeDemoLms(e.clientX,e.clientY),gesture:mouseG,isRight:false}];
  handVel[0]=vel;
});
fxCvs.addEventListener('mouseleave',()=>{if(!camActive&&!demoMode)handData=[];});
fxCvs.addEventListener('click',()=>{
  initAudio();
  const gs=['OPEN','PEACE','POINT','FIST','ROCK','PINKY'];
  mouseG=gs[(gs.indexOf(mouseG)+1)%gs.length];
  gflash.textContent=GNAME[mouseG]||mouseG;gflash.style.opacity='1';
  setTimeout(()=>gflash.style.opacity='0',800);
});
fxCvs.addEventListener('touchmove',e=>{
  e.preventDefault();if(camActive||demoMode)return;
  const t=e.touches[0];
  handData=[{lms:makeDemoLms(t.clientX,t.clientY),gesture:mouseG,isRight:false}];
},{passive:false});
fxCvs.addEventListener('touchend',()=>{if(!camActive&&!demoMode)handData=[];});

// ═══════════════════════════════════════════════════════
// UI EVENTS
// ═══════════════════════════════════════════════════════
document.getElementById('cam-btn').addEventListener('click',()=>{
  if(camActive)stopCam();else startCam();
});
document.getElementById('demo-btn').addEventListener('click',()=>{
  if(cameraActive)stopCam();
  demoMode=!demoMode;
  const b=document.getElementById('demo-btn');
  b.classList.toggle('on',demoMode);
  b.textContent=demoMode?'✕ DEMO KAPAT':'🎭 DEMO';
  document.getElementById('status').textContent=demoMode?'DEMO AKTİF ✓':'Demo durduruldu';
  if(!demoMode) handData=[];
});
document.getElementById('fs-btn').addEventListener('click',()=>{
  if(!document.fullscreenElement) document.documentElement.requestFullscreen();
  else document.exitFullscreen?.();
});
// Palette buttons
document.querySelectorAll('.sp').forEach(b=>{
  b.addEventListener('click',()=>{
    const h=b.dataset.h, s=b.dataset.s;
    document.querySelectorAll(`.sp[data-h="${h}"]`).forEach(x=>x.classList.remove('on'));
    b.classList.add('on');
    if(h==='L') palL=s; else palR=s;
    document.getElementById('status').textContent=`Sol: ${palL.toUpperCase()} | Sağ: ${palR.toUpperCase()}`;
  });
});

// ═══════════════════════════════════════════════════════
// BOOT
// ═══════════════════════════════════════════════════════
let cameraActive=false; // alias
async function boot(){
  await initMP();
  requestAnimationFrame(loop);
  setTimeout(()=>{
    const ov=document.getElementById('loading');
    ov.style.transition='opacity .8s';ov.style.opacity='0';
    setTimeout(()=>ov.remove(),800);
  },1400);
}
boot();
</script>
