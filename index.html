<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arcane Hands - AR Hand Tracking</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #050510;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: white;
        }
        /* Arka plan kamera görüntüsü */
        #video-feed {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            transform: scaleX(-1); /* Ayna efekti */
            opacity: 0.15;
            z-index: 0;
            pointer-events: none;
        }
        /* Three.js 3D Sahnesi */
        #canvas-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
        }
        /* Arayüz */
        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 10;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            padding: 15px 20px;
            border-radius: 12px;
        }
        #ui h1 {
            margin: 0;
            font-size: 16px;
            letter-spacing: 2px;
            color: #b060ff;
        }
        #status {
            margin-top: 5px;
            font-size: 12px;
            color: rgba(255, 255, 255, 0.6);
        }
    </style>
    <!-- Three.js ve MediaPipe Kütüphaneleri (CDN) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
</head>
<body>

    <video id="video-feed" autoplay playsinline muted></video>
    <div id="canvas-container"></div>
    
    <div id="ui">
        <h1>ARCANE HANDS</h1>
        <div id="status">Kamera başlatılıyor, lütfen bekleyin...</div>
    </div>

    <script>
        // --- 1. THREE.JS SAHNE KURULUMU ---
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        
        // Kamera ayarları
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 6;

        // Render ayarları
        const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        container.appendChild(renderer.domElement);

        // Pencere boyutu değiştiğinde tepki ver
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // --- 2. EL İSKELETİ (MATERYAL VE GEOMETRİ) ---
        // Eklemleri bağlayan çizgiler
        const connections = [
            [0, 1], [1, 2], [2, 3], [3, 4],
            [5, 6], [6, 7], [7, 8],
            [9, 10], [10, 11], [11, 12],
            [13, 14], [14, 15], [15, 16],
            [17, 18], [18, 19], [19, 20],
            [0, 5], [5, 9], [9, 13], [13, 17]
        ];

        // 3D Çizgi Materyali (Arcane Mor Rengi)
        const lineMaterial = new THREE.LineBasicMaterial({ 
            color: 0xb060ff, 
            transparent: true, 
            opacity: 0.6,
            linewidth: 2
        });

        // Parmak uçlarındaki parlayan noktalar
        const pointMaterial = new THREE.PointsMaterial({
            color: 0xffffff,
            size: 0.2,
            transparent: true,
            opacity: 0.9,
            blending: THREE.AdditiveBlending
        });

        // Sahnede tutulacak ellerin dizisi
        let handLines = [];
        let handPoints = [];

        // 2 el için boş meshleri sahneye ekleyelim
        for (let i = 0; i < 2; i++) {
            const lineGeo = new THREE.BufferGeometry();
            lineGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(connections.length * 2 * 3), 3));
            const lines = new THREE.LineSegments(lineGeo, lineMaterial);
            
            const pointGeo = new THREE.BufferGeometry();
            pointGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(21 * 3), 3));
            const points = new THREE.Points(pointGeo, pointMaterial);

            scene.add(lines);
            scene.add(points);
            
            handLines.push(lines);
            handPoints.push(points);
        }

        // --- 3. MEDIAPIPE HANDS KURULUMU ---
        const videoElement = document.getElementById('video-feed');
        const statusElement = document.getElementById('status');

        function onResults(results) {
            statusElement.innerText = "Eller izleniyor...";

            // Tüm elleri gizle (ekranda el yoksa görünmesin)
            handLines.forEach(l => l.visible = false);
            handPoints.forEach(p => p.visible = false);

            if (results.multiHandLandmarks) {
                // Algılanan her el için Three.js objelerini güncelle
                results.multiHandLandmarks.forEach((landmarks, index) => {
                    if (index >= 2) return; // Sadece max 2 eli destekle

                    const lines = handLines[index];
                    const points = handPoints[index];
                    
                    lines.visible = true;
                    points.visible = true;

                    const linePositions = lines.geometry.attributes.position.array;
                    const pointPositions = points.geometry.attributes.position.array;

                    let lineIdx = 0;
                    let pointIdx = 0;

                    // Koordinat Dönüştürücü: MediaPipe(0-1) => Three.js(-8 to 8)
                    const mapLandmark = (lm) => ({
                        x: (1 - lm.x - 0.5) * 12,
                        y: -(lm.y - 0.5) * 8,
                        z: lm.z * -10
                    });

                    // Çizgileri oluştur (Kemikler)
                    for (const [start, end] of connections) {
                        const p1 = mapLandmark(landmarks[start]);
                        const p2 = mapLandmark(landmarks[end]);

                        linePositions[lineIdx++] = p1.x; linePositions[lineIdx++] = p1.y; linePositions[lineIdx++] = p1.z;
                        linePositions[lineIdx++] = p2.x; linePositions[lineIdx++] = p2.y; linePositions[lineIdx++] = p2.z;
                    }

                    // Noktaları oluştur (Eklemler)
                    for (let i = 0; i < 21; i++) {
                        const p = mapLandmark(landmarks[i]);
                        pointPositions[pointIdx++] = p.x;
                        pointPositions[pointIdx++] = p.y;
                        pointPositions[pointIdx++] = p.z;
                    }

                    lines.geometry.attributes.position.needsUpdate = true;
                    points.geometry.attributes.position.needsUpdate = true;
                });
            }
        }

        const hands = new Hands({locateFile: (file) => {
            return `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`;
        }});
        
        hands.setOptions({
            maxNumHands: 2,
            modelComplexity: 1,
            minDetectionConfidence: 0.5,
            minTrackingConfidence: 0.5
        });
        
        hands.onResults(onResults);

        // Kamerayı başlat
        const cameraUtils = new Camera(videoElement, {
            onFrame: async () => {
                await hands.send({image: videoElement});
            },
            width: 640,
            height: 480
        });
        
        cameraUtils.start().then(() => {
            statusElement.innerText = "Kamera aktif. Ellerinizi gösterin.";
        }).catch((err) => {
            statusElement.innerText = "Kamera hatası: " + err;
        });

        // --- 4. RENDER DÖNGÜSÜ ---
        function animate() {
            requestAnimationFrame(animate);
            // Sahneyi yavaşça kendi etrafında döndürerek 3D hissini arttırabiliriz (İsteğe bağlı)
            // scene.rotation.y = Math.sin(Date.now() * 0.001) * 0.1;
            renderer.render(scene, camera);
        }
        animate();

    </script>
</body>
</html>
