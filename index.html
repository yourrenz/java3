<body>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>

<script>
'use strict';

// ════════════════════════════════════════════════════
// CANVAS SETUP
// ════════════════════════════════════════════════════
const video = document.getElementById('video');
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d', {willReadFrequently: true});
const statusEl = document.getElementById('status');
const camBtn = document.getElementById('cam-btn');
const demoBtn = document.getElementById('demo-btn');
const tutorialEl = document.getElementById('tutorial');

function resizeCanvas() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
resizeCanvas();
window.addEventListener('resize', resizeCanvas);

// ════════════════════════════════════════════════════
// RENKLER
// ════════════════════════════════════════════════════
const COLORS = {
  arcane:   {r:176, g:96,  b:255, rgb:'176,96,255',   name:'Arcane',    hex:'#b060ff'},
  electric: {r:64,  g:192, b:255, rgb:'64,192,255',   name:'Electric',  hex:'#40d0ff'},
  fire:     {r:255, g:95,  b:20,  rgb:'255,95,20',    name:'Fire',      hex:'#ff5f1f'},
  ice:      {r:100, g:220, b:255, rgb:'100,220,255',  name:'Ice',       hex:'#80f0ff'},
  divine:   {r:255, g:195, b:80,  rgb:'255,195,80',   name:'Divine',    hex:'#ffd060'},
};

let currentColor = 'arcane';
let currentIntensity = 1;

// ════════════════════════════════════════════════════
// PARTIKÜLLER
// ════════════════════════════════════════════════════
const MAX_PARTICLES = 1500;
const particles = [];

class Particle {
  constructor(x, y, color, type = 'normal') {
    this.x = x;
    this.y = y;
    this.color = color;
    this.type = type;
    
    if (type === 'snow') { // KAR TANESİ
      this.vx = (Math.random() - 0.5) * 0.8;
      this.vy = Math.random() * 1 + 0.5;
      this.life = 1;
      this.decay = 0.004 + Math.random() * 0.002;
      this.size = Math.random() * 3 + 1;
      this.rotation = Math.random() * Math.PI * 2;
      this.rotSpeed = (Math.random() - 0.5) * 0.08;
      this.wobble = Math.random() * Math.PI * 2;
    } else if (type === 'ember') { // ATEŞ
      this.vx = (Math.random() - 0.5) * 3;
      this.vy = -(Math.random() * 3 + 2.5);
      this.life = 1;
      this.decay = 0.04 + Math.random() * 0.03;
      this.size = Math.random() * 14 + 6;
      this.wobble = Math.random() * Math.PI * 2;
      this.glow = 1;
    } else if (type === 'smoke') { // IŞIK DUMANI
      this.vx = (Math.random() - 0.5) * 1.2;
      this.vy = Math.random() * -2 - 0.8;
      this.life = 1;
      this.decay = 0.006 + Math.random() * 0.004;
      this.size = Math.random() * 30 + 20;
      this.rotation = Math.random() * Math.PI * 2;
      this.rotSpeed = (Math.random() - 0.5) * 0.04;
      this.expansion = 1;
    } else if (type === 'spark') { // ÇAKIŞAN ÇIZGILER
      const angle = Math.random() * Math.PI * 2;
      const speed = Math.random() * 7 + 4;
      this.vx = Math.cos(angle) * speed;
      this.vy = Math.sin(angle) * speed;
      this.life = 1;
      this.decay = 0.05 + Math.random() * 0.04;
      this.size = Math.random() * 2.5 + 0.5;
      this.trail = [];
    } else if (type === 'orb') { // BÜYÜ KÜRESI
      const angle = Math.random() * Math.PI * 2;
      const speed = Math.random() * 1.5 + 0.5;
      this.vx = Math.cos(angle) * speed;
      this.vy = Math.sin(angle) * speed;
      this.life = 1;
      this.decay = 0.015 + Math.random() * 0.01;
      this.size = Math.random() * 6 + 3;
      this.pulse = Math.random();
    } else { // NORMAL
      const angle = Math.random() * Math.PI * 2;
      const speed = Math.random() * 2 + 0.8;
      this.vx = Math.cos(angle) * speed;
      this.vy = Math.sin(angle) * speed;
      this.life = 1;
      this.decay = 0.018 + Math.random() * 0.015;
      this.size = Math.random() * 8 + 2;
    }
  }

  update() {
    this.x += this.vx;
    this.y += this.vy;
    
    if (this.type === 'snow') {
      this.wobble += 0.05;
      this.vx += Math.sin(this.wobble) * 0.02;
    }
    if (this.type === 'ember') {
      this.vy -= 0.15;
      this.wobble += 0.06;
      this.glow *= 0.98;
    }
    if (this.type === 'smoke') {
      this.expansion += 0.01;
    }
    if (this.type === 'spark') {
      this.vy += 0.08;
    }
    if (this.type === 'orb') {
      this.pulse += 0.03;
    }
    
    this.vx *= 0.95;
    this.vy *= 0.95;
    this.life -= this.decay;
    if (this.size > 0.3) this.size *= 0.96;
  }

  draw(ctx, color) {
    if (this.life <= 0) return;

    ctx.save();

    if (this.type === 'snow') { // KAR TANESİ
      ctx.globalAlpha = this.life * 0.7;
      ctx.translate(this.x, this.y);
      ctx.rotate(this.rotation);
      
      ctx.strokeStyle = `rgba(${color.rgb},${this.life})`;
      ctx.lineWidth = this.size * 0.5;
      ctx.lineCap = 'round';
      
      // 6 kollu kar tanesi
      for (let i = 0; i < 6; i++) {
        const a = (i * Math.PI) / 3;
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.lineTo(Math.cos(a) * this.size * 2, Math.sin(a) * this.size * 2);
        ctx.stroke();
      }

    } else if (this.type === 'ember') { // ATEŞ
      const wobbleX = Math.sin(this.wobble) * 2;
      ctx.globalAlpha = Math.max(0, this.life * this.glow);
      ctx.shadowBlur = this.size * 4;
      ctx.shadowColor = `rgb(${color.rgb})`;
      
      const grad = ctx.createRadialGradient(
        this.x + wobbleX, this.y, 0,
        this.x, this.y, this.size
      );
      grad.addColorStop(0, `rgba(255,220,0,${this.life})`);
      grad.addColorStop(0.4, `rgba(${color.rgb},${this.life * 0.8})`);
      grad.addColorStop(1, `rgba(${color.rgb},0)`);
      
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
      ctx.fill();

    } else if (this.type === 'smoke') { // IŞIK DUMANI
      ctx.globalAlpha = this.life * 0.15;
      ctx.translate(this.x, this.y);
      if (this.rotation) ctx.rotate(this.rotation);
      
      const expandedSize = this.size * this.expansion;
      const grad = ctx.createRadialGradient(0, 0, 0, 0, 0, expandedSize);
      grad.addColorStop(0, `rgba(${color.rgb},${this.life * 0.5})`);
      grad.addColorStop(0.5, `rgba(${color.rgb},${this.life * 0.2})`);
      grad.addColorStop(1, `rgba(${color.rgb},0)`);
      
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(0, 0, expandedSize, 0, Math.PI * 2);
      ctx.fill();

    } else if (this.type === 'spark') { // ÇAKIŞAN ÇIZGILER
      ctx.globalAlpha = this.life * 0.8;
      ctx.strokeStyle = `rgba(${color.rgb},${this.life})`;
      ctx.lineWidth = this.size * 3;
      ctx.lineCap = 'round';
      ctx.shadowBlur = 8;
      ctx.shadowColor = `rgb(${color.rgb})`;
      
      ctx.beginPath();
      ctx.moveTo(this.x - this.vx * 3, this.y - this.vy * 3);
      ctx.lineTo(this.x, this.y);
      ctx.stroke();

    } else if (this.type === 'orb') { // BÜYÜ KÜRESI
      ctx.globalAlpha = this.life * 0.9;
      const pulseSize = this.size * (1 + Math.sin(this.pulse) * 0.2);
      
      ctx.shadowBlur = pulseSize * 3;
      ctx.shadowColor = `rgb(${color.rgb})`;
      
      const grad = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, pulseSize);
      grad.addColorStop(0, `rgba(255,255,255,${this.life})`);
      grad.addColorStop(0.3, `rgba(${color.rgb},${this.life * 0.9})`);
      grad.addColorStop(1, `rgba(${color.rgb},0)`);
      
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(this.x, this.y, pulseSize, 0, Math.PI * 2);
      ctx.fill();

    } else { // NORMAL
      ctx.globalAlpha = this.life * 0.8;
      ctx.shadowBlur = this.size * 2;
      ctx.shadowColor = `rgb(${color.rgb})`;
      
      const grad = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, this.size);
      grad.addColorStop(0, `rgba(255,255,255,${this.life})`);
      grad.addColorStop(0.4, `rgba(${color.rgb},${this.life * 0.9})`);
      grad.addColorStop(1, `rgba(${color.rgb},0)`);
      
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
      ctx.fill();
    }

    ctx.restore();
  }
}

function spawnParticles(x, y, count = 8, types = ['normal']) {
  if (particles.length >= MAX_PARTICLES) return;
  
  const color = COLORS[currentColor];
  for (let i = 0; i < count && particles.length < MAX_PARTICLES; i++) {
    const type = types[Math.floor(Math.random() * types.length)];
    particles.push(new Particle(x, y, color, type));
  }
}

// ════════════════════════════════════════════════════
// HAND DETECTION
// ════════════════════════════════════════════════════
let hands = null;
let handLandmarks = [];
let handGestures = [];
let cameraActive = false;

async function initHands() {
  try {
    hands = new Hands({
      locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
    });
    hands.setOptions({
      maxNumHands: 2,
      modelComplexity: 1,
      minDetectionConfidence: 0.7,
      minTrackingConfidence: 0.5
    });
    hands.onResults(onHandsResults);
    statusEl.textContent = '✓ Ready — Click CAMERA';
  } catch (e) {
    statusEl.textContent = '⚠ Use DEMO mode';
    console.error(e);
  }
}

function onHandsResults(results) {
  handLandmarks = results.multiHandLandmarks || [];
}

// ════════════════════════════════════════════════════
// JEST ALGILAMA
// ════════════════════════════════════════════════════
function detectGesture(landmarks) {
  const tips = [4, 8, 12, 16, 20].map(i => landmarks[i]);
  const pips = [3, 6, 10, 14, 18].map(i => landmarks[i]);
  const wrist = landmarks[0];
  
  let extended = 0;
  extended += Math.abs(tips[0].x - wrist.x) > Math.abs(pips[0].x - wrist.x) * 0.6 ? 1 : 0;
  for (let i = 1; i < 5; i++) {
    extended += tips[i].y < pips[i].y ? 1 : 0;
  }
  
  if (extended >= 4) return 'OPEN';
  if (extended === 0) return 'FIST';
  if (extended === 2 && tips[1].y < pips[1].y && tips[2].y < pips[2].y) return 'PEACE';
  if (extended === 1 && tips[1].y < pips[1].y) return 'POINT';
  if (!extended && tips[4].y < pips[4].y) return 'PINKY';
  if (tips[0].x < wrist.x && !extended && tips[4].y < pips[4].y) return 'ROCK';
  return 'PARTIAL';
}

const GESTURE_EFFECTS = {
  OPEN: {types: ['orb', 'smoke', 'normal'], count: 12},
  FIST: {types: ['ember', 'smoke'], count: 8},
  PEACE: {types: ['spark', 'spark', 'spark'], count: 15},
  POINT: {types: ['spark', 'spark', 'spark'], count: 20},
  PINKY: {types: ['snow', 'normal', 'normal'], count: 10},
  ROCK: {types: ['ember', 'spark', 'ember'], count: 18},
  PARTIAL: {types: ['normal', 'normal'], count: 5}
};

// ════════════════════════════════════════════════════
// LANDMARK KOORDİNATI
// ════════════════════════════════════════════════════
function getLandmarkScreen(lm) {
  return {
    x: (1 - lm.x) * canvas.width,
    y: lm.y * canvas.height
  };
}

function getPalmCenter(landmarks) {
  const indices = [0, 5, 9, 13, 17];
  let x = 0, y = 0;
  indices.forEach(i => {
    const p = getLandmarkScreen(landmarks[i]);
    x += p.x / indices.length;
    y += p.y / indices.length;
  });
  return {x, y};
}

// ════════════════════════════════════════════════════
// DEMO MOD
// ════════════════════════════════════════════════════
let demoMode = false;
let demoTime = 0;

function makeDemoHand(cx, cy) {
  return Array.from({length: 21}, (_, i) => ({
    x: 1 - (cx + Math.sin(i * 0.9) * 70) / canvas.width,
    y: (cy + Math.cos(i * 0.9) * 50) / canvas.height,
    z: 0
  }));
}

function updateDemo() {
  if (!demoMode) return;
  demoTime += 0.016;
  handLandmarks = [
    makeDemoHand(canvas.width * 0.25 + Math.sin(demoTime) * 100, 
                 canvas.height * 0.45 + Math.cos(demoTime * 0.7) * 80),
    makeDemoHand(canvas.width * 0.75 + Math.sin(demoTime + Math.PI) * 100, 
                 canvas.height * 0.55 + Math.cos(demoTime * 0.7 + Math.PI) * 80)
  ];
}

// ════════════════════════════════════════════════════
// KAMERA
// ════════════════════════════════════════════════════
async function startCamera() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: {facingMode: 'user', width: {ideal: 1280}, height: {ideal: 720}}
    });
    video.srcObject = stream;
    video.style.display = 'block';
    statusEl.textContent = '✓ Camera active';
    camBtn.textContent = '✕ KAPAT';
    camBtn.classList.add('active');
    cameraActive = true;
    demoMode = false;
    demoBtn.classList.remove('active');
    tutorialEl.style.opacity = '0.8';
    
    if (hands) {
      const camera = new Camera(video, {
        onFrame: async () => {
          if (cameraActive) await hands.send({image: video});
        },
        width: 1280,
        height: 720
      });
      camera.start();
    }
  } catch (e) {
    statusEl.textContent = '✗ Camera error: ' + e.message;
  }
}

function stopCamera() {
  if (video.srcObject) {
    video.srcObject.getTracks().forEach(t => t.stop());
  }
  video.style.display = 'none';
  statusEl.textContent = 'Camera closed';
  camBtn.textContent = '📷 KAMERA AÇ';
  camBtn.classList.remove('active');
  cameraActive = false;
  handLandmarks = [];
  tutorialEl.style.opacity = '0.6';
}

camBtn.addEventListener('click', async () => {
  if (cameraActive) {
    stopCamera();
  } else {
    await startCamera();
  }
});

// ════════════════════════════════════════════════════
// DEMO BUTTON
// ════════════════════════════════════════════════════
demoBtn.addEventListener('click', () => {
  if (cameraActive) stopCamera();
  demoMode = !demoMode;
  
  if (demoMode) {
    demoBtn.classList.add('active');
    demoBtn.textContent = '✕ DEMO KAPAT';
    statusEl.textContent = '🎭 Demo aktif';
    tutorialEl.style.opacity = '1';
  } else {
    demoBtn.classList.remove('active');
    demoBtn.textContent = '🎭 DEMO';
    statusEl.textContent = 'Demo kapatıldı';
    handLandmarks = [];
    tutorialEl.style.opacity = '0.6';
  }
});

// ════════════════════════════════════════════════════
// RENK SEÇİM
// ════════════════════════════════════════════════════
document.querySelectorAll('.color-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.color-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentColor = btn.dataset.color;
    statusEl.textContent = `✦ ${COLORS[currentColor].name} ✦`;
  });
});

// ════════════════════════════════════════════════════
// STATS
// ════════════════════════════════════════════════════
let frameCount = 0;
let lastFpsTime = Date.now();
let fpsValue = 60;

function updateStats() {
  frameCount++;
  const now = Date.now();
  if (now - lastFpsTime >= 1000) {
    fpsValue = frameCount;
    frameCount = 0;
    lastFpsTime = now;
  }
  
  document.getElementById('particle-count').textContent = particles.length;
  document.getElementById('hand-count').textContent = handLandmarks.length;
  document.getElementById('fps-count').textContent = fpsValue;
}

// ════════════════════════════════════════════════════
// ANA RENDER LOOP
// ════════════════════════════════════════════════════
function animate() {
  requestAnimationFrame(animate);
  updateStats();

  // Clear canvas
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // Draw particles with lighter blend
  ctx.globalCompositeOperation = 'lighter';
  for (let i = particles.length - 1; i >= 0; i--) {
    particles[i].update();
    if (particles[i].life <= 0) {
      particles.splice(i, 1);
    } else {
      particles[i].draw(ctx, COLORS[currentColor]);
    }
  }
  ctx.globalCompositeOperation = 'source-over';

  // Process hands
  updateDemo();
  
  handLandmarks.forEach((landmarks, handIdx) => {
    const gesture = detectGesture(landmarks);
    const palm = getPalmCenter(landmarks);
    
    // Gest efektlerini spawn et
    if (GESTURE_EFFECTS[gesture]) {
      const effect = GESTURE_EFFECTS[gesture];
      spawnParticles(palm.x, palm.y, effect.count, effect.types);
    }

    // Parmak uçlarından iz
    [4, 8, 12, 16, 20].forEach(tipIdx => {
      const tip = getLandmarkScreen(landmarks[tipIdx]);
      if (frameCount % 4 === 0) {
        spawnParticles(tip.x, tip.y, 2, ['normal', 'normal']);
      }
    });

    // El iskeletini çiz
    ctx.globalAlpha = 0.3;
    ctx.strokeStyle = COLORS[currentColor].hex;
    ctx.lineWidth = 2.5;
    
    const connections = [
      [0,1],[1,2],[2,3],[3,4],
      [5,6],[6,7],[7,8],
      [9,10],[10,11],[11,12],
      [13,14],[14,15],[15,16],
      [17,18],[18,19],[19,20],
      [0,5],[5,9],[9,13],[13,17]
    ];

    connections.forEach(([from, to]) => {
      const p1 = getLandmarkScreen(landmarks[from]);
      const p2 = getLandmarkScreen(landmarks[to]);
      ctx.beginPath();
      ctx.moveTo(p1.x, p1.y);
      ctx.lineTo(p2.x, p2.y);
      ctx.stroke();
    });

    // Parmak uçlarını göster
    [4, 8, 12, 16, 20].forEach(tipIdx => {
      const tip = getLandmarkScreen(landmarks[tipIdx]);
      ctx.globalAlpha = 0.7;
      ctx.fillStyle = COLORS[currentColor].hex;
      ctx.beginPath();
      ctx.arc(tip.x, tip.y, 7, 0, Math.PI * 2);
      ctx.fill();
    });

    // Avuç merkezini göster
    ctx.globalAlpha = 0.8;
    ctx.fillStyle = COLORS[currentColor].hex;
    ctx.beginPath();
    ctx.arc(palm.x, palm.y, 10, 0, Math.PI * 2);
    ctx.fill();
  });

  ctx.globalAlpha = 1;
}

// ════════════════════════════════════════════════════
// BAŞLAT
// ════════════════════════════════════════════════════
initHands();
animate();
tutorialEl.style.opacity = '0.6';
</script>
